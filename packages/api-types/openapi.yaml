components:
  schemas:
    ApiToken:
      type: object
      description: Never includes the secret or its hash.
      properties:
        id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/ApiTokenKindEnum'
        prefix:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - id
      - kind
      - last_used_at
      - name
      - prefix
      - revoked_at
      - site_id
    ApiTokenCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/ApiTokenKindEnum'
      required:
      - kind
      - name
    ApiTokenCreated:
      type: object
      description: Never includes the secret or its hash.
      properties:
        id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/ApiTokenKindEnum'
        prefix:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        token:
          type: string
          description: The full token. Shown only once; store it now.
      required:
      - created_at
      - id
      - kind
      - last_used_at
      - name
      - prefix
      - revoked_at
      - site_id
      - token
    ApiTokenKindEnum:
      enum:
      - delivery
      - preview
      type: string
      description: |-
        * `delivery` - Delivery
        * `preview` - Preview
    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        actor_user:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          nullable: true
        actor_token_id:
          type: string
          format: uuid
          nullable: true
        target_type:
          type: string
        target_id:
          type: string
        metadata:
          type: object
          additionalProperties: {}
        ip:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - action
      - actor_token_id
      - actor_user
      - created_at
      - id
      - ip
      - metadata
      - target_id
      - target_type
    AuditLogPage:
      type: object
