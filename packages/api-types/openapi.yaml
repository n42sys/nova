openapi: 3.0.3
info:
  title: Nova API
  version: 0.1.0
paths:
  /api/manage/invitations/{token}/:
    get:
      operationId: invitation_preview
      description: 'Public and read-only: what an invitation link offers. The token
        is the credential.'
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - manage
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: ''
  /api/manage/invitations/{token}/accept/:
    post:
      operationId: invitation_accept
      description: |-
        Logged-in user whose email matches the invitation joins its organization.

        Status is checked by the service under a row lock, so a race cannot accept twice.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - manage
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOrganization'
          description: ''
  /api/manage/invitations/{token}/claim/:
    post:
      operationId: invitation_claim
      description: 'Public: remember the invitation in this session so its invitee
        can sign up.'
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - manage
      security:
      - sessionAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/manage/me/:
    get:
      operationId: me_retrieve
      tags:
      - manage
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
