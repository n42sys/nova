          maxLength: 63
          pattern: ^[-a-zA-Z0-9_]+$
        timezone:
          type: string
          maxLength: 64
        default_locale:
          type: string
          maxLength: 16
        settings:
          type: object
          additionalProperties: {}
    PaymentAccount:
      type: object
      description: |-
